<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<title>Peta Hotspot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;font-family:sans-serif;}

body{
display:flex;
flex-direction:column;
}

.header{
display:grid;
grid-template-columns:auto 1fr auto;
align-items:center;
padding:6px 10px;
background:#444;
color:white;
height:60px;
}

.logo{
height:36px;
}

.title{
text-align:center;
font-size:13px;
font-weight:bold;
line-height:1.3;
}

.main{
flex:1;
position:relative;
}

#map{
width:100%;
height:100%;
}

.filters{
position:absolute;
top:50%;
left:10px;
transform:translateY(-50%);
background:white;
padding:10px;
border-radius:6px;
font-size:13px;
z-index:999;
box-shadow:0 1px 6px rgba(0,0,0,0.2);
max-width:90vw;
}

.filters h4{
margin:10px 0 6px;
}

.filters label{
display:block;
margin-bottom:4px;
}

.export-button{
padding:6px 10px;
background:#444;
color:white;
border:none;
border-radius:4px;
font-size:12px;
cursor:pointer;
width:100%;
margin-bottom:4px;
}

.dropdown{
position:relative;
width:100%;
}

.dropdown-content{
display:none;
position:absolute;
background:white;
min-width:140px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
border:1px solid #ccc;
border-radius:4px;
}

.dropdown-content a{
display:block;
padding:8px 10px;
text-decoration:none;
color:black;
font-size:13px;
}

.dropdown-content a:hover{
background:#eee;
}

.dropdown:hover .dropdown-content{
display:block;
}

#login-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10000;
}

</style>
</head>

<body>

<div id="login-overlay">
<h2>Masukkan Password</h2>
<input id="password-input" type="password">
<button onclick="checkPassword()">Masuk</button>
<div id="login-error" style="color:red;display:none;">Password salah</div>
</div>

<div class="header">
<img src="logo-kiri.png" class="logo">
<div class="title">
DIREKTORAT PENGENDALIAN KEBAKARAN LAHAN<br>
<small>Peta Hotspot Level Confidence Medium - High selama 3 hari</small>
</div>
<img src="logo-kanan.png" class="logo">
</div>

<div class="main">

<div class="filters">

<h4>Confidence Level</h4>

<label><input type="checkbox" class="confidence-filter" value="medium" checked> 🟡 Medium</label>
<label><input type="checkbox" class="confidence-filter" value="high" checked> 🔴 High</label>

<h4>Tanggal</h4>
<div id="tanggal-filter"></div>

<h4>Sumber</h4>
<div id="sumber-filter"></div>

<h4>Layer Tambahan</h4>

<label><input type="checkbox" id="pbph-toggle"> PBPH</label>
<label><input type="checkbox" id="kebun-toggle"> Kebun</label>

<h4>Download Data</h4>

<div class="dropdown">
<button class="export-button">⬇️ Data</button>

<div class="dropdown-content">
<a href="#" onclick="exportTable('csv')">CSV</a>
<a href="#" onclick="exportTable('xlsx')">XLSX</a>
<a href="#" onclick="exportTable('pdf')">PDF</a>
</div>
</div>

<button class="export-button" onclick="exportPBPHHotspotPDF()">📄 Hotspot PBPH</button>

<button class="export-button" onclick="exportKebunHotspotPDF()">📄 Hotspot Kebun</button>

<button class="export-button" onclick="window.print()">🖨️ Cetak Peta</button>

</div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map=L.map('map',{attributionControl:false}).setView([-2.5,117],5)

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:18}
).addTo(map)

const hotspotLayer=L.layerGroup().addTo(map)

let pbphLayer=null
let kebunLayer=null

fetch('PBPH.geojson')
.then(r=>r.json())
.then(g=>{
pbphLayer=L.geoJSON(g,{style:{color:"blue",weight:1,fillOpacity:0}})
})

fetch('kebun.geojson')
.then(r=>r.json())
.then(g=>{
kebunLayer=L.geoJSON(g,{style:{color:"green",weight:1,fillOpacity:0}})
})

document.getElementById('pbph-toggle').addEventListener('change',function(){
if(this.checked)pbphLayer.addTo(map)
else map.removeLayer(pbphLayer)
})

document.getElementById('kebun-toggle').addEventListener('change',function(){
if(this.checked)kebunLayer.addTo(map)
else map.removeLayer(kebunLayer)
})

const url="https://opensheet.elk.sh/1Vce5YUId7cUZ29j8OEhdFSer26cszXgX3OSm5zoX1UI/Data%20Hotspot%20Nasional"

let rawData=[]

function extractTanggal(t){
const p=t.split(',')[1]?.trim().split(' ')||[]
return p.slice(0,3).join(' ')
}

function getSelectedFilters(){

const levels=[...document.querySelectorAll('.confidence-filter:checked')].map(x=>x.value)

const tanggal=[...document.querySelectorAll('.tanggal-filter:checked')].map(x=>x.value)

const sumber=[...document.querySelectorAll('.sumber-filter:checked')].map(x=>x.value)

return{levels,tanggal,sumber}
}

function fetchData(){

fetch(url)
.then(r=>r.json())
.then(d=>{
rawData=d
})
}

function hotspotAnalysis(layer){

const {levels,tanggal,sumber}=getSelectedFilters()

const hasil={}

rawData.forEach(row=>{

const lat=parseFloat(row.Latitude)
const lon=parseFloat(row.Longitude)

const conf=row.Confidence_Level?.toLowerCase()
const tgl=extractTanggal(row["Tanggal & Jam"]||"")
const src=row.Sumber?.trim()||""

if(!levels.includes(conf)||!tanggal.includes(tgl)||!sumber.includes(src))return

const point=turf.point([lon,lat])

layer.eachLayer(function(poly){

if(turf.booleanPointInPolygon(point,poly.feature)){

const prov=row.Provinsi||"Unknown"

const perusahaan=poly.feature.properties.NAMA_PERUSAHAAN
||poly.feature.properties.nama
||"Tidak diketahui"

if(!hasil[prov])hasil[prov]={}

if(!hasil[prov][perusahaan])hasil[prov][perusahaan]=0

hasil[prov][perusahaan]++

}

})

})

return hasil
}

function generatePDF(data,title,file){

const {jsPDF}=window.jspdf

const doc=new jsPDF()

let table=[]

for(const prov in data){

for(const perusahaan in data[prov]){

table.push([prov,perusahaan,data[prov][perusahaan]])

}

}

doc.text(title,14,15)

doc.autoTable({

startY:20,

head:[['Provinsi','Perusahaan','Jumlah Hotspot']],

body:table,

styles:{fontSize:8}

})

doc.save(file)

}

function exportPBPHHotspotPDF(){

if(!pbphLayer){alert("PBPH belum dimuat");return}

const data=hotspotAnalysis(pbphLayer)

generatePDF(data,"Analisis Hotspot PBPH","hotspot_pbph.pdf")

}

function exportKebunHotspotPDF(){

if(!kebunLayer){alert("Kebun belum dimuat");return}

const data=hotspotAnalysis(kebunLayer)

generatePDF(data,"Analisis Hotspot Kebun","hotspot_kebun.pdf")

}

function checkPassword(){

const p=document.getElementById('password-input').value

if(p==="karla"){

localStorage.setItem("hotspot_logged_in","true")

document.getElementById('login-overlay').style.display='none'

fetchData()

}

else{

document.getElementById('login-error').style.display='block'

}

}

window.onload=()=>{

if(localStorage.getItem("hotspot_logged_in")==="true"){

document.getElementById('login-overlay').style.display='none'

fetchData()

}

}

</script>

</body>
</html>
