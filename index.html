<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Peta Hotspot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<!-- Tambahan analisis spasial -->
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;font-family:sans-serif;}
body{display:flex;flex-direction:column;}

.header{
display:grid;
grid-template-columns:auto 1fr auto;
align-items:center;
padding:6px 10px;
background:#444;
color:white;
height:60px;
}

.logo{height:36px;}

.title{
text-align:center;
font-size:13px;
font-weight:bold;
line-height:1.3;
}

.main{flex:1;position:relative;}

#map{width:100%;height:100%;}

.filters{
position:absolute;
top:50%;
left:10px;
transform:translateY(-50%);
background:rgba(255,255,255,0.95);
padding:10px;
border-radius:6px;
font-size:13px;
z-index:999;
box-shadow:0 1px 6px rgba(0,0,0,0.2);
max-width:90vw;
}

.filters h4{margin:10px 0 6px;font-size:14px;}
.filters label{display:block;margin-bottom:4px;}

.export-button{
padding:6px 10px;
background:#444;
color:white;
border:none;
border-radius:4px;
font-size:12px;
cursor:pointer;
width:100%;
margin-top:4px;
}

.dropdown{position:relative;width:100%;}
.dropdown-content{
display:none;
position:absolute;
background:white;
min-width:140px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
z-index:1000;
border:1px solid #ccc;
border-radius:4px;
}

.dropdown-content a{
color:black;
padding:8px 10px;
text-decoration:none;
display:block;
font-size:13px;
}

.dropdown-content a:hover{background:#f0f0f0;}
.dropdown:hover .dropdown-content{display:block;}

@media print{
.header,.filters{display:none!important;}
#map{height:100vh!important;width:100vw!important;}
}

#login-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10000;
}

#login-overlay input{
padding:10px;
font-size:16px;
border-radius:6px;
border:none;
margin-top:10px;
}

#login-overlay button{
margin-top:12px;
padding:8px 16px;
font-size:14px;
background:#444;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

#login-error{color:red;margin-top:10px;display:none;}
</style>
</head>

<body>

<div id="login-overlay">
<h2>Masukkan Password</h2>
<input id="password-input" type="password" placeholder="Password" />
<button onclick="checkPassword()">Masuk</button>
<div id="login-error">Password salah</div>
</div>

<div class="header">
<img src="logo-kiri.png" class="logo">
<div class="title">
DIREKTORAT PENGENDALIAN KEBAKARAN LAHAN<br>
<small>Peta Hotspot Level Confidence Medium - High selama 3 hari</small>
</div>
<img src="logo-kanan.png" class="logo">
</div>

<div class="main">

<div class="filters">

<h4>Confidence Level</h4>
<label><input type="checkbox" class="confidence-filter" value="medium" checked> 🟡 Medium</label>
<label><input type="checkbox" class="confidence-filter" value="high" checked> 🔴 High</label>

<h4>Tanggal</h4>
<div id="tanggal-filter">Memuat...</div>

<h4>Sumber</h4>
<div id="sumber-filter">Memuat...</div>

<h4>Layer Tambahan</h4>
<label><input type="checkbox" id="pbph-toggle"> PBPH (garis biru)</label>
<label><input type="checkbox" id="kebun-toggle"> Kebun (garis hijau)</label>
<label><input type="checkbox" id="gambut-toggle"> Gambut (garis coklat)</label>

<h4>Download Data</h4>

<div class="dropdown">
<button class="export-button">⬇️ Pilih Format</button>
<div class="dropdown-content">
<a href="#" onclick="exportTable('csv')">📄 CSV</a>
<a href="#" onclick="exportTable('xlsx')">📄 XLSX</a>
<a href="#" onclick="exportTable('pdf')">📄 PDF</a>
</div>
</div>

<button class="export-button" onclick="window.print()">🖨️ Cetak Peta</button>

<h4>Analisis Hotspot</h4>
<button class="export-button" onclick="analisisPBPH()">🔥 Analisis PBPH</button>
<button class="export-button" onclick="analisisKebun()">🌴 Analisis Kebun</button>

</div>

<div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map',{attributionControl:false}).setView([-2.5,117],5);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:18}
).addTo(map);

const hotspotLayer=L.layerGroup().addTo(map);

fetch('provinsi.geojson')
.then(res=>res.json())
.then(geo=>{
L.geoJSON(geo,{style:{color:"black",weight:1,fillOpacity:0}}).addTo(map);
});

let pbphLayer=null;
let pbphData=null;

fetch('PBPH.geojson')
.then(res=>res.json())
.then(geo=>{
pbphData=geo;

pbphLayer=L.geoJSON(geo,{
style:{color:"blue",weight:1,fillOpacity:0},
onEachFeature:function(feature,layer){

let popupText='';

for(const key in feature.properties){
popupText += `<b>${key}</b>: ${feature.properties[key]}<br>`;
}

layer.bindPopup(popupText);

}
});
});

let kebunLayer=null;
let kebunData=null;

fetch('kebun.geojson')
.then(res=>res.json())
.then(geo=>{
kebunData=geo;

kebunLayer=L.geoJSON(geo,{
style:{color:"green",weight:2,fillOpacity:0.1},
onEachFeature:function(feature,layer){

let popupText='';

for(const key in feature.properties){
popupText += `<b>${key}</b>: ${feature.properties[key]}<br>`;
}

layer.bindPopup(popupText);

}
});
});

let gambutLayer=null;

fetch('gambut.geojson')
.then(res=>res.json())
.then(geo=>{
gambutLayer=L.geoJSON(geo,{
style:{color:"brown",weight:2,fillOpacity:0.1}
});
});

document.getElementById('pbph-toggle').addEventListener('change',function(){
if(this.checked && pbphLayer){pbphLayer.addTo(map);}
else if(pbphLayer){map.removeLayer(pbphLayer);}
});

document.getElementById('kebun-toggle').addEventListener('change',function(){
if(this.checked && kebunLayer){kebunLayer.addTo(map);}
else if(kebunLayer){map.removeLayer(kebunLayer);}
});

document.getElementById('gambut-toggle').addEventListener('change',function(){
if(this.checked && gambutLayer){gambutLayer.addTo(map);}
else if(gambutLayer){map.removeLayer(gambutLayer);}
});

const url="https://opensheet.elk.sh/1Vce5YUId7cUZ29j8OEhdFSer26cszXgX3OSm5zoX1UI/Data%20Hotspot%20Nasional";

let rawData=[];

function applyFilters(){

hotspotLayer.clearLayers();

rawData.forEach(row=>{

const lat=parseFloat(row.Latitude);
const lon=parseFloat(row.Longitude);
const conf=row.Confidence_Level?.toLowerCase();

if(!isNaN(lat)&&!isNaN(lon)){

const color=conf==="high"?"red":"yellow";

L.circleMarker([lat,lon],{
radius:6,
fillColor:color,
color:"#000",
weight:1,
opacity:0.5,
fillOpacity:0.5
})
.addTo(hotspotLayer)
.bindPopup(`
<b>${row["Tanggal & Jam"]}</b><br>
${row.Provinsi} - ${row["Kab/Kota"]}<br>
Kecamatan: ${row.Kecamatan}<br>
Desa: ${row.Desa}<br>
Confidence: ${conf}<br>
Sumber: ${row.Sumber}<br>
Koordinat: ${lat.toFixed(4)}, ${lon.toFixed(4)}
`);

}

});

}

fetch(url)
.then(res=>res.json())
.then(data=>{
rawData=data;
applyFilters();
});

function analisisPBPH(){

if(!pbphData){alert("Layer PBPH belum dimuat");return;}

const hasil={};

rawData.forEach(row=>{

const lat=parseFloat(row.Latitude);
const lon=parseFloat(row.Longitude);

if(isNaN(lat)||isNaN(lon))return;

const pt=turf.point([lon,lat]);

pbphData.features.forEach(f=>{

if(turf.booleanPointInPolygon(pt,f)){

const nama=f.properties.NAMA||f.properties.PERUSAHAAN||"Tidak diketahui";

hasil[nama]=(hasil[nama]||0)+1;

}

});

});

let text="Analisis Hotspot PBPH\n\n";

Object.entries(hasil)
.sort((a,b)=>b[1]-a[1])
.forEach(([nama,jumlah])=>{
text+=`${nama} : ${jumlah} hotspot\n`;
});

alert(text);

}

function analisisKebun(){

if(!kebunData){alert("Layer Kebun belum dimuat");return;}

const hasil={};

rawData.forEach(row=>{

const lat=parseFloat(row.Latitude);
const lon=parseFloat(row.Longitude);

if(isNaN(lat)||isNaN(lon))return;

const pt=turf.point([lon,lat]);

kebunData.features.forEach(f=>{

if(turf.booleanPointInPolygon(pt,f)){

const nama=f.properties.NAMA||f.properties.PERUSAHAAN||"Tidak diketahui";

hasil[nama]=(hasil[nama]||0)+1;

}

});

});

let text="Analisis Hotspot Kebun\n\n";

Object.entries(hasil)
.sort((a,b)=>b[1]-a[1])
.forEach(([nama,jumlah])=>{
text+=`${nama} : ${jumlah} hotspot\n`;
});

alert(text);

}

function checkPassword(){

const input=document.getElementById("password-input").value;

if(input==="karla"){
localStorage.setItem("hotspot_logged_in","true");
document.getElementById("login-overlay").style.display="none";
init();
}
else{
document.getElementById("login-error").style.display="block";
}

}

function init(){
fetch(url)
.then(res=>res.json())
.then(data=>{
rawData=data;
applyFilters();
});
}

window.onload=()=>{
const loggedIn=localStorage.getItem("hotspot_logged_in");
if(loggedIn==="true"){
document.getElementById("login-overlay").style.display="none";
init();
}
};

</script>
</body>
</html>
