<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Peta Hotspot</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      height: 60px;
      padding: 6px 10px;
      color: white;
      background: #444;
      flex-shrink: 0;
    }

    .logo {
      height: 36px;
      max-width: 120px;
      object-fit: contain;
    }

    .title {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      line-height: 1.3;
    }

    .title small {
      font-weight: normal;
    }

    .main {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .filters {
      position: absolute;
      top: 50%;
      left: 10px;
      z-index: 999;
      width: 225px;
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 90px);
      padding: 10px;
      overflow-y: auto;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.96);
      border-radius: 6px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.25);
      font-size: 13px;
    }

    .filters h4 {
      margin: 10px 0 6px;
      font-size: 14px;
    }

    .filters h4:first-child {
      margin-top: 0;
    }

    .filters label {
      display: block;
      margin-bottom: 5px;
      cursor: pointer;
    }

    .filter-message {
      color: #666;
      font-size: 12px;
    }

    #jumlah-hotspot {
      margin-top: 8px;
      padding: 6px;
      color: #174a80;
      background: #eef5ff;
      border-radius: 4px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
    }

    .export-button {
      width: 100%;
      margin-top: 4px;
      padding: 7px 10px;
      color: white;
      background: #444;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .export-button:hover {
      background: #222;
    }

    .dropdown {
      position: relative;
      width: 100%;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      z-index: 1000;
      width: 100%;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    .dropdown-content a {
      display: block;
      padding: 8px 10px;
      color: black;
      text-decoration: none;
    }

    .dropdown-content a:hover {
      background: #f0f0f0;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    #login-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      background: rgba(0,0,0,0.88);
    }

    #login-overlay input {
      width: 250px;
      max-width: 90vw;
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    #login-overlay button {
      margin-top: 12px;
      padding: 8px 20px;
      color: white;
      background: #444;
      border: 1px solid #777;
      border-radius: 6px;
      cursor: pointer;
    }

    #login-error {
      display: none;
      margin-top: 10px;
      color: #ff6b6b;
    }

    @media (max-width: 600px) {
      .header {
        grid-template-columns: 45px 1fr 45px;
      }

      .logo {
        width: 45px;
        height: 32px;
      }

      .title {
        font-size: 10px;
      }

      .filters {
        top: 10px;
        width: 205px;
        transform: none;
      }
    }

    @media print {
      .header,
      .filters,
      #login-overlay {
        display: none !important;
      }

      #map {
        width: 100vw !important;
        height: 100vh !important;
      }
    }
  </style>
</head>

<body>

  <div id="login-overlay">
    <h2>Masukkan Password</h2>

    <input
      id="password-input"
      type="password"
      placeholder="Password"
    >

    <button onclick="checkPassword()">
      Masuk
    </button>

    <div id="login-error">
      Password salah
    </div>
  </div>

  <div class="header">
    <img src="logo-kiri.png" class="logo" alt="Logo kiri">

    <div class="title">
      DIREKTORAT PENGENDALIAN KEBAKARAN LAHAN
      <br>
      <small>
        Peta Hotspot Confidence Medium–High selama 3 hari
      </small>
    </div>

    <img src="logo-kanan.png" class="logo" alt="Logo kanan">
  </div>

  <div class="main">

    <div class="filters">

      <h4>Confidence Level</h4>

      <label>
        <input
          type="checkbox"
          class="confidence-filter"
          value="medium"
          checked
        >
        🟡 Medium
      </label>

      <label>
        <input
          type="checkbox"
          class="confidence-filter"
          value="high"
          checked
        >
        🔴 High
      </label>

      <h4>Tanggal</h4>

      <div id="tanggal-filter" class="filter-message">
        Memuat...
      </div>

      <h4>Sumber Citra</h4>

      <label>
        <input
          type="checkbox"
          class="sumber-filter"
          value="NASA-MODIS"
          checked
        >
        NASA-MODIS
      </label>

      <label>
        <input
          type="checkbox"
          class="sumber-filter"
          value="NASA-NOAA20"
          checked
        >
        NASA-NOAA20
      </label>

      <label>
        <input
          type="checkbox"
          class="sumber-filter"
          value="NASA-SNPP"
          checked
        >
        NASA-SNPP
      </label>

      <div id="jumlah-hotspot">
        Memuat hotspot...
      </div>

      <h4>Layer Tambahan</h4>

      <label>
        <input type="checkbox" id="pbph-toggle">
        PBPH (biru)
      </label>

      <label>
        <input type="checkbox" id="kebun-toggle">
        Kebun (hijau)
      </label>

      <label>
        <input type="checkbox" id="gambut-toggle">
        Gambut (coklat)
      </label>

      <h4>Download Data</h4>

      <div class="dropdown">
        <button class="export-button">
          ⬇️ Pilih Format
        </button>

        <div class="dropdown-content">
          <a href="#" onclick="exportTable('csv'); return false;">
            📄 CSV
          </a>

          <a href="#" onclick="exportTable('xlsx'); return false;">
            📄 XLSX
          </a>

          <a href="#" onclick="exportTable('pdf'); return false;">
            📄 PDF
          </a>
        </div>
      </div>

      <button
        class="export-button"
        onclick="window.print()"
      >
        🖨️ Cetak Peta
      </button>

      <button
        class="export-button"
        onclick="exportPerusahaanPDF('pbph')"
      >
        📄 PDF Hotspot PBPH
      </button>

      <button
        class="export-button"
        onclick="exportPerusahaanPDF('kebun')"
      >
        📄 PDF Hotspot Kebun
      </button>

    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /*
     * ======================================================
     * KONFIGURASI
     * ======================================================
     */

    const DATA_URL =
      "https://opensheet.elk.sh/" +
      "1Vce5YUId7cUZ29j8OEhdFSer26cszXgX3OSm5zoX1UI/" +
      "Data%20Hotspot%20Nasional";

    const PASSWORD = "karla";

    const SUMBER_YANG_DIIZINKAN = [
      "NASA-MODIS",
      "NASA-NOAA20",
      "NASA-SNPP"
    ];

    const NAMA_BULAN = [
      "Januari",
      "Februari",
      "Maret",
      "April",
      "Mei",
      "Juni",
      "Juli",
      "Agustus",
      "September",
      "Oktober",
      "November",
      "Desember"
    ];

    let rawData = [];

    let provinsiLayer = null;
    let pbphLayer = null;
    let kebunLayer = null;
    let gambutLayer = null;

    let aplikasiSudahDimulai = false;
    let filterListenerSudahDipasang = false;

    /*
     * ======================================================
     * PETA
     * ======================================================
     */

    const map = L.map("map", {
      attributionControl: false,
      preferCanvas: true
    }).setView([-2.5, 117], 5);

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/" +
      "World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 18,
        updateWhenIdle: true
      }
    ).addTo(map);

    const hotspotRenderer =
      L.canvas({
        padding: 0.5
      });

    const polygonRenderer =
      L.svg({
        padding: 0.5
      });

    const hotspotLayer =
      L.layerGroup().addTo(map);

    /*
     * ======================================================
     * FUNGSI UMUM
     * ======================================================
     */

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function ambilNilai(
      row,
      daftarNama
    ) {
      for (const nama of daftarNama) {
        if (
          Object.prototype.hasOwnProperty.call(
            row,
            nama
          ) &&
          row[nama] !== null &&
          row[nama] !== undefined &&
          String(row[nama]).trim() !== ""
        ) {
          return String(
            row[nama]
          ).trim();
        }
      }

      return "";
    }

    function normalisasiNamaKolom(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
    }

    function ambilPropertiGeoJSON(
      properties,
      daftarNama
    ) {
      if (!properties) {
        return "";
      }

      const semuaKey =
        Object.keys(properties);

      for (const kemungkinan of daftarNama) {
        const target =
          normalisasiNamaKolom(
            kemungkinan
          );

        const key =
          semuaKey.find(
            nama =>
              normalisasiNamaKolom(nama) ===
              target
          );

        if (
          key &&
          properties[key] !== null &&
          properties[key] !== undefined &&
          String(
            properties[key]
          ).trim() !== ""
        ) {
          return String(
            properties[key]
          ).trim();
        }
      }

      return "";
    }

    function formatNamaAtribut(nama) {
      return String(nama || "")
        .replaceAll("_", " ")
        .replace(
          /([a-z])([A-Z])/g,
          "$1 $2"
        )
        .replace(
          /\b\w/g,
          huruf =>
            huruf.toUpperCase()
        );
    }

    function formatNilaiAtribut(value) {
      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      if (
        typeof value === "object"
      ) {
        try {
          return JSON.stringify(
            value
          );
        } catch (error) {
          return String(value);
        }
      }

      return String(value).trim();
    }

    function buatBarisPopup(
      label,
      nilai
    ) {
      if (
        nilai === null ||
        nilai === undefined ||
        String(nilai).trim() === ""
      ) {
        return "";
      }

      return `
        <tr>
          <td style="
            width:42%;
            padding:5px;
            border:1px solid #ddd;
            background:#f2f2f2;
            font-weight:bold;
            vertical-align:top;
          ">
            ${escapeHtml(label)}
          </td>

          <td style="
            padding:5px;
            border:1px solid #ddd;
            vertical-align:top;
            word-break:break-word;
          ">
            ${escapeHtml(nilai)}
          </td>
        </tr>
      `;
    }

    function buatKotakPopup(
      judul,
      warna,
      baris
    ) {
      const isi =
        baris.filter(Boolean).join("");

      return `
        <div style="
          min-width:230px;
          max-width:340px;
          max-height:310px;
          overflow-y:auto;
          font-family:Arial,sans-serif;
          font-size:12px;
        ">
          <div style="
            position:sticky;
            top:0;
            z-index:1;
            margin-bottom:7px;
            padding:7px;
            color:white;
            background:${warna};
            border-radius:4px;
            text-align:center;
            font-weight:bold;
          ">
            ${escapeHtml(judul)}
          </div>

          ${
            isi
              ? `
                <table style="
                  width:100%;
                  border-collapse:collapse;
                ">
                  ${isi}
                </table>
              `
              : `
                <div style="padding:8px;">
                  Atribut tidak tersedia.
                </div>
              `
          }
        </div>
      `;
    }

    async function fetchJson(
      url,
      namaData
    ) {
      const response =
        await fetch(
          url,
          {
            cache: "no-store"
          }
        );

      if (!response.ok) {
        throw new Error(
          `${namaData} gagal dimuat. HTTP ${response.status}`
        );
      }

      const text =
        await response.text();

      try {
        return JSON.parse(text);
      } catch (error) {
        throw new Error(
          `${namaData} bukan JSON yang valid`
        );
      }
    }

    /*
     * ======================================================
     * POPUP SELURUH ATRIBUT POLYGON
     * ======================================================
     */

    function popupSemuaAtribut(
      namaLayer,
      warna,
      styleNormal
    ) {
      return function (
        feature,
        layer
      ) {
        const properties =
          feature?.properties || {};

        const daftarAtribut =
          Object.entries(
            properties
          ).filter(
            ([key, value]) =>
              key &&
              formatNilaiAtribut(
                value
              ) !== ""
          );

        const baris =
          daftarAtribut.map(
            ([key, value]) =>
              buatBarisPopup(
                formatNamaAtribut(
                  key
                ),
                formatNilaiAtribut(
                  value
                )
              )
          );

        const popupHtml =
          buatKotakPopup(
            `SELURUH ATRIBUT ${namaLayer}`,
            warna,
            baris
          );

        layer.bindPopup(
          popupHtml,
          {
            maxWidth: 400,
            maxHeight: 370,
            autoPan: true,
            closeButton: true,
            keepInView: true
          }
        );

        layer.on(
          "click",
          function (event) {
            this.openPopup(
              event.latlng
            );
          }
        );

        layer.on(
          "mouseover",
          function () {
            this.setStyle({
              weight: 5,
              fillOpacity: 0.45
            });
          }
        );

        layer.on(
          "mouseout",
          function () {
            this.setStyle(
              styleNormal
            );
          }
        );
      };
    }

    /*
     * ======================================================
     * LOAD GEOJSON
     * ======================================================
     */

    async function loadProvinsi() {
      if (provinsiLayer) {
        return provinsiLayer;
      }

      try {
        const geojson =
          await fetchJson(
            "provinsi.geojson",
            "Batas provinsi"
          );

        provinsiLayer =
          L.geoJSON(
            geojson,
            {
              interactive: false,

              style: {
                color: "black",
                weight: 1,
                fillOpacity: 0,
                interactive: false
              }
            }
          ).addTo(map);

        if (
          provinsiLayer.bringToBack
        ) {
          provinsiLayer.bringToBack();
        }

        return provinsiLayer;
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    async function loadPBPH() {
      if (pbphLayer) {
        return pbphLayer;
      }

      try {
        const geojson =
          await fetchJson(
            "PBPH.geojson",
            "Layer PBPH"
          );

        const stylePBPH = {
          color: "blue",
          weight: 2,
          opacity: 1,
          fill: true,
          fillColor: "blue",
          fillOpacity: 0.20
        };

        pbphLayer =
          L.geoJSON(
            geojson,
            {
              renderer:
                polygonRenderer,

              interactive: true,

              bubblingMouseEvents:
                false,

              style:
                stylePBPH,

              onEachFeature:
                popupSemuaAtribut(
                  "PBPH",
                  "#2458a6",
                  stylePBPH
                )
            }
          );

        return pbphLayer;
      } catch (error) {
        console.error(
          "PBPH gagal dimuat:",
          error
        );

        alert(
          "Layer PBPH gagal dimuat.\n\n" +
          error.message
        );

        return null;
      }
    }

    async function loadKebun() {
      if (kebunLayer) {
        return kebunLayer;
      }

      try {
        const geojson =
          await fetchJson(
            "kebun.geojson",
            "Layer kebun"
          );

        const styleKebun = {
          color: "green",
          weight: 2,
          opacity: 1,
          fill: true,
          fillColor: "green",
          fillOpacity: 0.20
        };

        kebunLayer =
          L.geoJSON(
            geojson,
            {
              renderer:
                polygonRenderer,

              interactive: true,

              bubblingMouseEvents:
                false,

              style:
                styleKebun,

              onEachFeature:
                popupSemuaAtribut(
                  "KEBUN",
                  "#23823b",
                  styleKebun
                )
            }
          );

        return kebunLayer;
      } catch (error) {
        console.error(
          "Kebun gagal dimuat:",
          error
        );

        alert(
          "Layer kebun gagal dimuat.\n\n" +
          error.message
        );

        return null;
      }
    }

    async function loadGambut() {
      if (gambutLayer) {
        return gambutLayer;
      }

      try {
        const geojson =
          await fetchJson(
            "gambut.geojson",
            "Layer gambut"
          );

        const styleGambut = {
          color: "brown",
          weight: 2,
          opacity: 1,
          fill: true,
          fillColor: "brown",
          fillOpacity: 0.20
        };

        gambutLayer =
          L.geoJSON(
            geojson,
            {
              renderer:
                polygonRenderer,

              interactive: true,

              bubblingMouseEvents:
                false,

              style:
                styleGambut,

              onEachFeature:
                popupSemuaAtribut(
                  "GAMBUT",
                  "#795234",
                  styleGambut
                )
            }
          );

        return gambutLayer;
      } catch (error) {
        console.error(
          "Gambut gagal dimuat:",
          error
        );

        alert(
          "Layer gambut gagal dimuat.\n\n" +
          error.message
        );

        return null;
      }
    }

    /*
     * ======================================================
     * TOGGLE LAYER
     * ======================================================
     */

    function pasangLayerListeners() {
      document
        .getElementById(
          "pbph-toggle"
        )
        .addEventListener(
          "change",
          async function () {
            if (!this.checked) {
              if (pbphLayer) {
                map.removeLayer(
                  pbphLayer
                );
              }

              return;
            }

            this.disabled = true;

            const layer =
              await loadPBPH();

            this.disabled = false;

            if (
              layer &&
              this.checked
            ) {
              layer.addTo(map);

              if (
                layer.bringToFront
              ) {
                layer.bringToFront();
              }
            } else if (!layer) {
              this.checked = false;
            }
          }
        );

      document
        .getElementById(
          "kebun-toggle"
        )
        .addEventListener(
          "change",
          async function () {
            if (!this.checked) {
              if (kebunLayer) {
                map.removeLayer(
                  kebunLayer
                );
              }

              return;
            }

            this.disabled = true;

            const layer =
              await loadKebun();

            this.disabled = false;

            if (
              layer &&
              this.checked
            ) {
              layer.addTo(map);

              if (
                layer.bringToFront
              ) {
                layer.bringToFront();
              }
            } else if (!layer) {
              this.checked = false;
            }
          }
        );

      document
        .getElementById(
          "gambut-toggle"
        )
        .addEventListener(
          "change",
          async function () {
            if (!this.checked) {
              if (gambutLayer) {
                map.removeLayer(
                  gambutLayer
                );
              }

              return;
            }

            this.disabled = true;

            const layer =
              await loadGambut();

            this.disabled = false;

            if (
              layer &&
              this.checked
            ) {
              layer.addTo(map);

              if (
                layer.bringToFront
              ) {
                layer.bringToFront();
              }
            } else if (!layer) {
              this.checked = false;
            }
          }
        );
    }

    /*
     * ======================================================
     * DATA HOTSPOT
     * ======================================================
     */

    function normalisasiSumber(value) {
      const kode =
        String(value || "")
          .trim()
          .toUpperCase()
          .replace(
            /[^A-Z0-9]/g,
            ""
          );

      const mapping = {
        "NASAMODIS": "NASA-MODIS",
        "MODIS": "NASA-MODIS",

        "NASANOAA20": "NASA-NOAA20",
        "NOAA20": "NASA-NOAA20",
        "NOAA020": "NASA-NOAA20",

        "NASASNPP": "NASA-SNPP",
        "SNPP": "NASA-SNPP",
        "SUOMINPP": "NASA-SNPP",
        "NASASUOMINPP": "NASA-SNPP"
      };

      return mapping[kode] || "";
    }

    function ambilSumber(row) {
      return normalisasiSumber(
        ambilNilai(
          row,
          [
            "Sumber",
            "sumber",
            "Source",
            "source",
            "Satelit",
            "satelit",
            "Satellite"
          ]
        )
      );
    }

    function ambilLatitude(row) {
      const value =
        ambilNilai(
          row,
          [
            "Latitude",
            "latitude",
            "Lat",
            "lat"
          ]
        );

      return parseFloat(
        String(value)
          .replace(",", ".")
      );
    }

    function ambilLongitude(row) {
      const value =
        ambilNilai(
          row,
          [
            "Longitude",
            "longitude",
            "Lng",
            "lng",
            "Lon",
            "lon"
          ]
        );

      return parseFloat(
        String(value)
          .replace(",", ".")
      );
    }

    function ambilConfidence(row) {
      return ambilNilai(
        row,
        [
          "Confidence_Level",
          "Confidence Level",
          "confidence_level",
          "Confidence",
          "confidence"
        ]
      ).toLowerCase();
    }

    function ambilWaktu(row) {
      return ambilNilai(
        row,
        [
          "Tanggal & Jam",
          "Tanggal dan Jam",
          "Tanggal",
          "tanggal",
          "Date",
          "date",
          "Waktu"
        ]
      );
    }

    function formatTanggalIndonesia(date) {
      if (
        !(date instanceof Date) ||
        isNaN(date.getTime())
      ) {
        return "";
      }

      return (
        String(
          date.getDate()
        ).padStart(2, "0") +
        " " +
        NAMA_BULAN[
          date.getMonth()
        ] +
        " " +
        date.getFullYear()
      );
    }

    function extractTanggal(value) {
      if (!value) {
        return "";
      }

      const text =
        String(value).trim();

      const indonesia =
        text.match(
          /(\d{1,2})\s+(Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Desember)\s+(\d{4})/i
        );

      if (indonesia) {
        const tanggal =
          String(
            parseInt(
              indonesia[1],
              10
            )
          ).padStart(2, "0");

        const bulan =
          NAMA_BULAN.find(
            value =>
              value.toLowerCase() ===
              indonesia[2].toLowerCase()
          );

        return (
          tanggal +
          " " +
          bulan +
          " " +
          indonesia[3]
        );
      }

      const iso =
        text.match(
          /\b(\d{4})-(\d{1,2})-(\d{1,2})\b/
        );

      if (iso) {
        return (
          String(
            parseInt(
              iso[3],
              10
            )
          ).padStart(2, "0") +
          " " +
          NAMA_BULAN[
            parseInt(
              iso[2],
              10
            ) - 1
          ] +
          " " +
          iso[1]
        );
      }

      const angka =
        text.match(
          /\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})\b/
        );

      if (angka) {
        return (
          String(
            parseInt(
              angka[1],
              10
            )
          ).padStart(2, "0") +
          " " +
          NAMA_BULAN[
            parseInt(
              angka[2],
              10
            ) - 1
          ] +
          " " +
          angka[3]
        );
      }

      const date =
        new Date(text);

      return !isNaN(
        date.getTime()
      )
        ? formatTanggalIndonesia(date)
        : "";
    }

    function getLastThreeDates() {
      const hasil = [];

      for (
        let i = 0;
        i < 3;
        i++
      ) {
        const date =
          new Date();

        date.setHours(
          0,
          0,
          0,
          0
        );

        date.setDate(
          date.getDate() - i
        );

        hasil.push(
          formatTanggalIndonesia(
            date
          )
        );
      }

      return hasil;
    }

    function renderFilterTanggal() {
      const div =
        document.getElementById(
          "tanggal-filter"
        );

      div.className = "";

      div.innerHTML =
        getLastThreeDates()
          .map(
            tanggal => `
              <label>
                <input
                  type="checkbox"
                  class="tanggal-filter"
                  value="${escapeHtml(tanggal)}"
                  checked
                >
                ${escapeHtml(tanggal)}
              </label>
            `
          )
          .join("");
    }

    function getSelectedFilters() {
      return {
        levels:
          Array.from(
            document.querySelectorAll(
              ".confidence-filter:checked"
            )
          ).map(
            element =>
              element.value
          ),

        tanggal:
          Array.from(
            document.querySelectorAll(
              ".tanggal-filter:checked"
            )
          ).map(
            element =>
              element.value
          ),

        sumber:
          Array.from(
            document.querySelectorAll(
              ".sumber-filter:checked"
            )
          ).map(
            element =>
              element.value
          )
      };
    }

    function siapkanData(row) {
      row._latitude =
        ambilLatitude(row);

      row._longitude =
        ambilLongitude(row);

      row._confidence =
        ambilConfidence(row);

      row._waktu =
        ambilWaktu(row);

      row._tanggalFilter =
        extractTanggal(
          row._waktu
        );

      row._sumberNormal =
        ambilSumber(row);

      return row;
    }

    function dataSesuaiFilter(
      row,
      filter
    ) {
      return (
        filter.levels.includes(
          row._confidence
        ) &&
        filter.tanggal.includes(
          row._tanggalFilter
        ) &&
        filter.sumber.includes(
          row._sumberNormal
        )
      );
    }

    function getFilteredData() {
      const filter =
        getSelectedFilters();

      return rawData.filter(
        row =>
          dataSesuaiFilter(
            row,
            filter
          )
      );
    }

    /*
     * ======================================================
     * POPUP HOTSPOT
     * ======================================================
     */

    function applyFilters() {
      const filter =
        getSelectedFilters();

      hotspotLayer.clearLayers();

      let jumlah = 0;

      rawData.forEach(
        row => {
          if (
            !dataSesuaiFilter(
              row,
              filter
            )
          ) {
            return;
          }

          const lat =
            row._latitude;

          const lon =
            row._longitude;

          if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lon)
          ) {
            return;
          }

          const provinsi =
            ambilNilai(
              row,
              [
                "Provinsi",
                "provinsi"
              ]
            );

          const kabupaten =
            ambilNilai(
              row,
              [
                "Kab/Kota",
                "Kabupaten/Kota",
                "Kabupaten",
                "Kota"
              ]
            );

          const kecamatan =
            ambilNilai(
              row,
              [
                "Kecamatan",
                "kecamatan"
              ]
            );

          const desa =
            ambilNilai(
              row,
              [
                "Desa",
                "desa",
                "Kelurahan"
              ]
            );

          const warna =
            row._confidence ===
            "high"
              ? "red"
              : "yellow";

          const marker =
            L.circleMarker(
              [lat, lon],
              {
                renderer:
                  hotspotRenderer,

                radius: 6,
                fillColor:
                  warna,
                color: "#000",
                weight: 1,
                opacity: 0.9,
                fillOpacity: 0.75
              }
            );

          const popupHotspot =
            buatKotakPopup(
              "INFORMASI HOTSPOT",
              row._confidence ===
              "high"
                ? "#c62828"
                : "#c49a00",
              [
                buatBarisPopup(
                  "Tanggal & Jam",
                  row._waktu
                ),

                buatBarisPopup(
                  "Provinsi",
                  provinsi
                ),

                buatBarisPopup(
                  "Kab/Kota",
                  kabupaten
                ),

                buatBarisPopup(
                  "Kecamatan",
                  kecamatan
                ),

                buatBarisPopup(
                  "Desa",
                  desa
                ),

                buatBarisPopup(
                  "Latitude",
                  lat.toFixed(5)
                ),

                buatBarisPopup(
                  "Longitude",
                  lon.toFixed(5)
                ),

                buatBarisPopup(
                  "Confidence",
                  row._confidence
                    .toUpperCase()
                ),

                buatBarisPopup(
                  "Sumber",
                  row._sumberNormal
                )
              ]
            );

          marker.bindPopup(
            popupHotspot,
            {
              maxWidth: 360,
              maxHeight: 330,
              autoPan: true,
              closeButton: true
            }
          );

          hotspotLayer.addLayer(
            marker
          );

          jumlah++;
        }
      );

      document.getElementById(
        "jumlah-hotspot"
      ).textContent =
        `${jumlah} hotspot ditampilkan`;
    }

    function pasangFilterListeners() {
      if (
        filterListenerSudahDipasang
      ) {
        return;
      }

      document.addEventListener(
        "change",
        event => {
          if (
            event.target.matches(
              ".confidence-filter"
            ) ||
            event.target.matches(
              ".tanggal-filter"
            ) ||
            event.target.matches(
              ".sumber-filter"
            )
          ) {
            applyFilters();
          }
        }
      );

      filterListenerSudahDipasang =
        true;
    }

    async function fetchAndRenderData() {
      const jumlahElement =
        document.getElementById(
          "jumlah-hotspot"
        );

      try {
        jumlahElement.textContent =
          "Mengambil data hotspot...";

        const data =
          await fetchJson(
            DATA_URL,
            "Data hotspot"
          );

        if (
          !Array.isArray(data)
        ) {
          throw new Error(
            "Respons data bukan array"
          );
        }

        const tigaTanggal =
          new Set(
            getLastThreeDates()
          );

        rawData = data
          .map(
            siapkanData
          )
          .filter(
            row =>
              SUMBER_YANG_DIIZINKAN.includes(
                row._sumberNormal
              ) &&
              (
                row._confidence ===
                "medium" ||
                row._confidence ===
                "high"
              ) &&
              tigaTanggal.has(
                row._tanggalFilter
              ) &&
              Number.isFinite(
                row._latitude
              ) &&
              Number.isFinite(
                row._longitude
              )
          );

        renderFilterTanggal();
        pasangFilterListeners();

        requestAnimationFrame(
          applyFilters
        );
      } catch (error) {
        console.error(error);

        jumlahElement.textContent =
          "Data hotspot gagal dimuat";

        alert(
          "Data hotspot gagal dimuat.\n\n" +
          error.message
        );
      }
    }

    function exportTable(format) {
      const data =
        buatDataEkspor(
          getFilteredData()

      if (
        data.length === 0
      ) {
        alert(
          "Tidak ada data sesuai filter."
        );

        return;
      }

      if (
        format === "csv"
      ) {
        const sheet =
          XLSX.utils.json_to_sheet(
            data
          );

        const csv =
          XLSX.utils.sheet_to_csv(
            sheet,
            {
              FS: ";"
            }
          );

        const blob =
          new Blob(
            ["\uFEFF" + csv],
            {
              type:
                "text/csv;charset=utf-8"
            }
          );

        const url =
          URL.createObjectURL(
            blob
          );

        const link =
          document.createElement(
            "a"
          );

        link.href = url;
        link.download =
          "hotspot_nasa_3_hari.csv";

        link.click();

        URL.revokeObjectURL(
          url
        );

        return;
      }

      if (
        format === "xlsx"
      ) {
        const sheet =
          XLSX.utils.json_to_sheet(
            data
          );

        const workbook =
          XLSX.utils.book_new();

        XLSX.utils.book_append_sheet(
          workbook,
          sheet,
          "Hotspot"
        );

        XLSX.writeFile(
          workbook,
          "hotspot_nasa_3_hari.xlsx"
        );

        return;
      }

      if (
        format === "pdf"
      ) {
        const { jsPDF } =
          window.jspdf;

        const doc =
          new jsPDF({
            orientation:
              "landscape"
          });

        doc.text(

            "Sumber"

                  .toFixed(5),

     * ======================================================
     */

    function cariNamaPerusahaan(
      properties,
      type
    ) {
      /*
       * PBPH menggunakan atribut NAMAOBJ.
       */
      if (
        type === "pbph"
      ) {
        return (
          ambilPropertiGeoJSON(
            properties,
            [
              "NAMAOBJ",
              "NamaObj",
              "namaobj",
              "NAMA_OBJ",
              "Nama_Obj",
              "nama_obj"
            ]
          ) ||
          "Tidak diketahui"
        );
      }

      /*
       * Kebun menggunakan atribut PEMEGANGHA.
       */
      if (
        type === "kebun"
      ) {
        return (
          ambilPropertiGeoJSON(
            properties,
            [
              "PEMEGANGHA",
              "PemegangHa",
              "pemegangha",
              "PEMEGANG_HA",
              "Pemegang_Ha",
              "pemegang_ha"
            ]
          ) ||
          "Tidak diketahui"
        );
      }

      return "Tidak diketahui";
    }

    /*
     * ======================================================
     * PDF HOTSPOT PBPH DAN KEBUN
     * ======================================================
     */

    async function exportPerusahaanPDF(
      type
    ) {
      const isPBPH =
        type === "pbph";

      const namaLayer =
        isPBPH
          ? "PBPH"
          : "Kebun";

      const toggle =
        document.getElementById(
          isPBPH
            ? "pbph-toggle"
            : "kebun-toggle"
        );

      const layer =
        isPBPH
          ? pbphLayer
          : kebunLayer;

      if (
        !toggle.checked
      ) {
        alert(
          `Centang Layer ${namaLayer} terlebih dahulu.`
        );

        return;
      }

      if (
        !layer ||
        !map.hasLayer(layer)
      ) {
        alert(
          `Layer ${namaLayer} masih dimuat.\n\n` +
          "Tunggu sampai polygon muncul."
        );

        return;
      }

      const filter =
        getSelectedFilters();

      const filtered =
        getFilteredData();

      if (
        filter.levels.length === 0 ||
        filter.tanggal.length === 0 ||
        filter.sumber.length === 0
      ) {
        alert(
          "Pilih tanggal, confidence, dan sumber."
        );

        return;
      }

      if (
        filtered.length === 0
      ) {
        alert(
          "Tidak ada hotspot sesuai filter."
        );

        return;
      }

      const polygons = [];

      layer.eachLayer(
        polygonLayer => {
          if (
            typeof
              polygonLayer.toGeoJSON !==
            "function"
          ) {
            return;
          }

          const geojson =
            polygonLayer.toGeoJSON();

          const tipe =
            geojson
              ?.geometry
              ?.type;

          if (
            tipe !== "Polygon" &&
            tipe !== "MultiPolygon"
          ) {
            return;
          }

          const properties =
            polygonLayer
              .feature
              ?.properties ||
            geojson.properties ||
            {};

          polygons.push({
            nama:
              cariNamaPerusahaan(
                properties,
                type
              ),

            geojson,

            bbox:
              turf.bbox(
                geojson
              )
          });
        }
      );

      const rekap = {};
      const detail = [];

      filtered.forEach(
        row => {
          const lat =
            row._latitude;

          const lon =
            row._longitude;

          const point =
            turf.point(
              [lon, lat]
            );

          polygons.forEach(
            item => {
              const [
                minLon,
                minLat,
                maxLon,
                maxLat
              ] = item.bbox;

              if (
                lon < minLon ||
                lon > maxLon ||
                lat < minLat ||
                lat > maxLat
              ) {
                return;
              }

              let diDalam =
                false;

              try {
                diDalam =
                  turf
                    .booleanPointInPolygon(
                      point,
                      item.geojson
                    );
              } catch (error) {
                return;
              }

              if (!diDalam) {
                return;
              }

              if (
                !rekap[
                  item.nama
                ]
              ) {
                rekap[
                  item.nama
                ] = {
                  modis: 0,
                  noaa20: 0,
                  snpp: 0,
                  medium: 0,
                  high: 0,
                  total: 0
                };
              }

              const nilai =
                rekap[
                  item.nama
                ];

              nilai.total++;

              if (
                row._sumberNormal ===
                "NASA-MODIS"
              ) {
                nilai.modis++;
              }

              if (
                row._sumberNormal ===
                "NASA-NOAA20"
              ) {
                nilai.noaa20++;
              }

              if (
                row._sumberNormal ===
                "NASA-SNPP"
              ) {
                nilai.snpp++;
              }

              if (
                row._confidence ===
                "medium"
              ) {
                nilai.medium++;
              }

              if (
                row._confidence ===
                "high"
              ) {
                nilai.high++;
              }

              detail.push({
                nama:
                  item.nama,

                waktu:
                  row._waktu,

                provinsi:
                  ambilNilai(
                    row,
                    [
                      "Provinsi",
                      "provinsi"
                    ]
                  ),

                kabupaten:
                  ambilNilai(
                    row,
                    [
                      "Kab/Kota",
                      "Kabupaten/Kota",
                      "Kabupaten",
                      "Kota"
                    ]
                  ),

                lat,
                lon,

                confidence:
                  row._confidence,

                sumber:
                  row._sumberNormal
              });
            }
          );
        }
      );

      if (
        detail.length === 0
      ) {
        alert(
          `Tidak ditemukan hotspot di dalam ${namaLayer}.`
        );

        return;
      }

      const rekapRows =
        Object
          .entries(rekap)
          .sort(
            (a, b) =>
              b[1].total -
              a[1].total
          )
          .map(
            (
              [nama, nilai],
              index
            ) => [
              index + 1,
              nama,
              nilai.modis,
              nilai.noaa20,
              nilai.snpp,
              nilai.medium,
              nilai.high,
              nilai.total
            ]
          );

      const { jsPDF } =
        window.jspdf;

      const doc =
        new jsPDF({
          orientation:
            "landscape",
          unit: "mm",
          format: "a4"
        });

      doc.setFontSize(15);

      doc.text(
        `REKAP HOTSPOT DI DALAM ${namaLayer.toUpperCase()}`,
        14,
        14
      );

      doc.setFontSize(9);

      doc.text(
        `Tanggal: ${filter.tanggal.join(", ")}`,
        14,
        21
      );

      doc.text(
        `Confidence: ${filter.levels
          .map(
            value =>
              value.toUpperCase()
          )
          .join(", ")}`,
        14,
        26
      );

      doc.text(
        `Sumber: ${filter.sumber.join(", ")}`,
        14,
        31
      );

      doc.text(
        `Jumlah hotspot: ${detail.length}`,
        14,
        36
      );

      doc.autoTable({
        startY: 41,

        head: [[
          "No.",
          "Nama Perusahaan",
          "MODIS",
          "NOAA20",
          "SNPP",
          "Medium",
          "High",
          "Total"
        ]],

        body:
          rekapRows,

        theme:
          "grid",

        styles: {
          fontSize: 8
        },

        headStyles: {
          fillColor:
            isPBPH
              ? [30,90,180]
              : [30,130,70]
        }
      });

      doc.addPage(
        "a4",
        "landscape"
      );

      doc.setFontSize(13);

      doc.text(
        `DETAIL HOTSPOT ${namaLayer.toUpperCase()}`,
        14,
        14
      );

      doc.autoTable({
        startY: 20,

        head: [[
          "No.",
          "Nama Perusahaan",
          "Tanggal & Jam",
          "Provinsi",
          "Kab/Kota",
          "Latitude",
          "Longitude",
          "Confidence",
          "Sumber"
        ]],

        body:
          detail.map(
            (
              item,
              index
            ) => [
              index + 1,
              item.nama,
              item.waktu,
              item.provinsi,
              item.kabupaten,
              item.lat
                .toFixed(5),
              item.lon
                .toFixed(5),
              item.confidence
                .toUpperCase(),
              item.sumber
            ]
          ),

        styles: {
          fontSize: 7
        },

        headStyles: {
          fillColor:
            isPBPH
              ? [30,90,180]
              : [30,130,70]
        }
      });

      doc.save(
        `rekap_hotspot_${type}.pdf`
      );
    }

        localStorage.setItem(
          "hotspot_logged_in",
          "true"
        );

        document.getElementById(
          "login-error"
        ).style.display =
          "none";

        document.getElementById(
          "login-overlay"
        ).style.display =
          "none";

        init();
      } else {
        document.getElementById(
          "login-error"
        ).style.display =
          "block";

        input.focus();
        input.select();
      }
    }

    async function init() {
      if (
        aplikasiSudahDimulai
      ) {
        return;
      }

      aplikasiSudahDimulai =
        true;

      pasangLayerListeners();

      await fetchAndRenderData();

      setTimeout(
        loadProvinsi,
        100
      );

      setTimeout(
        () =>
          map.invalidateSize(),
        200
      );
    }

    document
      .getElementById(
        "password-input"
      )
      .addEventListener(
        "keydown",
        event => {
          if (
            event.key ===
            "Enter"
          ) {
            checkPassword();
          }
        }
      );

    window.addEventListener(
      "load",
      () => {
        const loggedIn =
          localStorage.getItem(
            "hotspot_logged_in"
          );

        if (
          loggedIn ===
          "true"
        ) {
          document.getElementById(
            "login-overlay"
          ).style.display =
            "none";

          init();
        } else {
          document
            .getElementById(
              "password-input"
            )
            .focus();
        }
      }
    );
  </script>

</body>
</html>
