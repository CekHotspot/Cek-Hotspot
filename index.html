<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<title>Peta Hotspot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<!-- TAMBAHAN UNTUK ANALISIS SPASIAL -->
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:sans-serif}
body{display:flex;flex-direction:column}

.header{
display:grid;
grid-template-columns:auto 1fr auto;
align-items:center;
padding:6px 10px;
background:#444;
color:white;
height:60px;
flex-shrink:0
}

.logo{height:36px}

.title{
text-align:center;
font-size:13px;
font-weight:bold;
line-height:1.3
}

.main{flex:1;position:relative}

#map{
width:100%;
height:100%
}

.filters{
position:absolute;
top:50%;
left:10px;
transform:translateY(-50%);
background:rgba(255,255,255,0.95);
padding:10px;
border-radius:6px;
font-size:13px;
z-index:999;
box-shadow:0 1px 6px rgba(0,0,0,0.2)
}

.filters h4{
margin:10px 0 6px
}

.filters label{
display:block;
margin-bottom:4px
}

.export-button{
padding:6px 10px;
background:#444;
color:white;
border:none;
border-radius:4px;
font-size:12px;
cursor:pointer;
width:100%
}

.dropdown{
position:relative;
width:100%
}

.dropdown-content{
display:none;
position:absolute;
background:white;
min-width:140px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
z-index:1000;
border:1px solid #ccc;
border-radius:4px
}

.dropdown-content a{
color:black;
padding:8px 10px;
text-decoration:none;
display:block
}

.dropdown-content a:hover{
background:#f0f0f0
}

.dropdown:hover .dropdown-content{
display:block
}

</style>
</head>

<body>

<div class="header">
<img src="logo-kiri.png" class="logo">
<div class="title">
DIREKTORAT PENGENDALIAN KEBAKARAN LAHAN<br>
<small>Peta Hotspot Level Confidence Medium - High selama 3 hari</small>
</div>
<img src="logo-kanan.png" class="logo">
</div>

<div class="main">

<div class="filters">

<h4>Confidence</h4>
<label><input type="checkbox" class="confidence-filter" value="medium" checked> 🟡 Medium</label>
<label><input type="checkbox" class="confidence-filter" value="high" checked> 🔴 High</label>

<h4>Tanggal</h4>
<div id="tanggal-filter"></div>

<h4>Sumber</h4>
<div id="sumber-filter"></div>

<h4>Layer</h4>
<label><input type="checkbox" id="pbph-toggle"> PBPH</label>
<label><input type="checkbox" id="kebun-toggle"> Kebun</label>
<label><input type="checkbox" id="gambut-toggle"> Gambut</label>

<h4>Download</h4>

<div class="dropdown">
<button class="export-button">⬇️ Export</button>
<div class="dropdown-content">
<a onclick="exportTable('csv')">CSV</a>
<a onclick="exportTable('xlsx')">XLSX</a>
<a onclick="exportTable('pdf')">PDF</a>
</div>
</div>

</div>

<div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map=L.map('map',{attributionControl:false}).setView([-2.5,117],5)

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
).addTo(map)

const hotspotLayer=L.layerGroup().addTo(map)

let pbphLayer=null
let kebunLayer=null
let gambutLayer=null

let pbphGeoJSON=null
let kebunGeoJSON=null

fetch('provinsi.geojson')
.then(res=>res.json())
.then(geo=>{
L.geoJSON(geo,{style:{color:"black",weight:1,fillOpacity:0}}).addTo(map)
})

/* PBPH */

fetch('PBPH.geojson')
.then(res=>res.json())
.then(geo=>{

pbphGeoJSON=geo

pbphLayer=L.geoJSON(geo,{
style:{color:"blue",weight:1,fillOpacity:0},
onEachFeature:function(feature,layer){

let txt=''

for(const k in feature.properties){
txt+=`<b>${k}</b>: ${feature.properties[k]}<br>`
}

layer.bindPopup(txt)

}
})

})

/* KEBUN */

fetch('kebun.geojson')
.then(res=>res.json())
.then(geo=>{

kebunGeoJSON=geo

kebunLayer=L.geoJSON(geo,{
style:{color:"green",weight:2,fillOpacity:0.1},
onEachFeature:function(feature,layer){

let txt=''

for(const k in feature.properties){
txt+=`<b>${k}</b>: ${feature.properties[k]}<br>`
}

layer.bindPopup(txt)

}
})

})

/* GAMBUT */

fetch('gambut.geojson')
.then(res=>res.json())
.then(geo=>{

gambutLayer=L.geoJSON(geo,{
style:{color:"brown",weight:2,fillOpacity:0.1}
})

})

/* TOGGLE */

document.getElementById('pbph-toggle').onchange=function(){

if(this.checked)pbphLayer.addTo(map)
else map.removeLayer(pbphLayer)

}

document.getElementById('kebun-toggle').onchange=function(){

if(this.checked)kebunLayer.addTo(map)
else map.removeLayer(kebunLayer)

}

document.getElementById('gambut-toggle').onchange=function(){

if(this.checked)gambutLayer.addTo(map)
else map.removeLayer(gambutLayer)

}

/* ANALISIS SPASIAL */

function hotspotDalamPolygon(lat,lon,geo){

const pt=turf.point([lon,lat])

for(let f of geo.features){

if(turf.booleanPointInPolygon(pt,f)){
return f.properties
}

}

return null

}

/* HOTSPOT DATA */

const url="https://opensheet.elk.sh/1Vce5YUId7cUZ29j8OEhdFSer26cszXgX3OSm5zoX1UI/Data%20Hotspot%20Nasional"

let rawData=[]

function applyFilters(){

hotspotLayer.clearLayers()

rawData.forEach(row=>{

const lat=parseFloat(row.Latitude)
const lon=parseFloat(row.Longitude)

if(isNaN(lat)||isNaN(lon))return

const conf=row.Confidence_Level?.toLowerCase()

const color=conf==="high"?"red":"yellow"

/* ANALISIS PBPH */

const pbph=pbphGeoJSON?
hotspotDalamPolygon(lat,lon,pbphGeoJSON):null

/* ANALISIS KEBUN */

const kebun=kebunGeoJSON?
hotspotDalamPolygon(lat,lon,kebunGeoJSON):null

L.circleMarker([lat,lon],{

radius:6,
fillColor:color,
color:"#000",
weight:1,
fillOpacity:0.6

})
.addTo(hotspotLayer)
.bindPopup(`

<b>${row["Tanggal & Jam"]}</b><br>
${row.Provinsi} - ${row["Kab/Kota"]}<br>
Kecamatan: ${row.Kecamatan}<br>
Desa: ${row.Desa}<br>

Confidence: ${conf}<br>

${pbph?"<b>PBPH:</b> "+(pbph.NAMA||pbph.NAMA_PBPH||"-")+"<br>":""}

${kebun?"<b>Kebun:</b> "+(kebun.NAMA||kebun.PERUSAHAAN||"-")+"<br>":""}

Koordinat: ${lat},${lon}<br>

<a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">
📍 Google Maps
</a>

`)

})

}

/* FETCH DATA */

fetch(url)
.then(res=>res.json())
.then(data=>{

rawData=data

applyFilters()

})

/* EXPORT */

function exportTable(format){

if(format==="csv"||format==="xlsx"){

const ws=XLSX.utils.json_to_sheet(rawData)
const wb=XLSX.utils.book_new()

XLSX.utils.book_append_sheet(wb,ws,"Hotspot")

XLSX.writeFile(wb,"hotspot."+format)

}

if(format==="pdf"){

const {jsPDF}=window.jspdf

const doc=new jsPDF()

const table=rawData.map(r=>[
r["Tanggal & Jam"],
r.Provinsi,
r["Kab/Kota"],
r.Kecamatan,
r.Desa,
r.Latitude,
r.Longitude
])

doc.autoTable({
head:[["Tanggal","Provinsi","Kab/Kota","Kecamatan","Desa","Lat","Lng"]],
body:table,
styles:{fontSize:8}
})

doc.save("hotspot.pdf")

}

}

</script>

</body>
</html>
