<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Peta Hotspot Nasional</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:Arial}

body{display:flex;flex-direction:column}

.header{
display:grid;
grid-template-columns:auto 1fr auto;
align-items:center;
padding:6px 10px;
background:#444;
color:white;
height:60px
}

.logo{height:36px}

.title{
text-align:center;
font-size:13px;
font-weight:bold
}

.main{flex:1;position:relative}

#map{width:100%;height:100%}

.filters{
position:absolute;
top:50%;
left:10px;
transform:translateY(-50%);
background:white;
padding:10px;
border-radius:6px;
font-size:13px;
z-index:999;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
width:180px
}

.filters h4{margin:10px 0 6px}

.filters label{display:block;margin-bottom:4px}

.btn{
padding:6px;
background:#444;
color:white;
border:none;
border-radius:4px;
font-size:12px;
cursor:pointer;
width:100%;
margin-top:4px
}

#login-overlay{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.9);
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999
}

#login-overlay input{
padding:10px;
font-size:16px;
margin-top:10px
}

</style>
</head>

<body>

<div id="login-overlay">
<h2>Masukkan Password</h2>
<input id="password-input" type="password">
<button class="btn" onclick="checkPassword()">Masuk</button>
<p id="login-error" style="color:red;display:none">Password salah</p>
</div>

<div class="header">
<img src="logo-kiri.png" class="logo">
<div class="title">
DIREKTORAT PENGENDALIAN KEBAKARAN LAHAN<br>
<small>Peta Hotspot Level Confidence Medium - High</small>
</div>
<img src="logo-kanan.png" class="logo">
</div>

<div class="main">

<div class="filters">

<h4>Confidence</h4>
<label><input type="checkbox" class="confidence-filter" value="medium" checked> 🟡 Medium</label>
<label><input type="checkbox" class="confidence-filter" value="high" checked> 🔴 High</label>

<h4>Tanggal</h4>
<div id="tanggal-filter"></div>

<h4>Sumber</h4>
<div id="sumber-filter"></div>

<h4>Layer</h4>
<label><input type="checkbox" id="pbph-toggle"> PBPH</label>
<label><input type="checkbox" id="kebun-toggle"> Kebun</label>
<label><input type="checkbox" id="gambut-toggle"> Gambut</label>

<h4>Export</h4>

<button class="btn" onclick="exportTable('csv')">⬇ CSV</button>
<button class="btn" onclick="exportTable('xlsx')">⬇ XLSX</button>
<button class="btn" onclick="exportTable('pdf')">⬇ PDF</button>

<h4>Analisis</h4>

<button class="btn" onclick="exportPBPH()">🔥 Hotspot PBPH</button>
<button class="btn" onclick="exportKebun()">🌴 Hotspot Kebun</button>

<button class="btn" onclick="window.print()">🖨 Cetak Peta</button>

</div>

<div id="map"></div>

</div>

<script>

const map=L.map('map',{attributionControl:false}).setView([-2.5,117],5)

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:18}
).addTo(map)

const hotspotLayer=L.layerGroup().addTo(map)

let pbphLayer=null
let kebunLayer=null
let gambutLayer=null

fetch('PBPH.geojson')
.then(r=>r.json())
.then(g=>{
pbphLayer=L.geoJSON(g,{style:{color:"blue",weight:1,fillOpacity:0}})
})

fetch('kebun.geojson')
.then(r=>r.json())
.then(g=>{
kebunLayer=L.geoJSON(g,{style:{color:"green",weight:2,fillOpacity:0.1}})
})

fetch('gambut.geojson')
.then(r=>r.json())
.then(g=>{
gambutLayer=L.geoJSON(g,{style:{color:"brown",weight:2,fillOpacity:0.1}})
})

document.getElementById('pbph-toggle').onchange=e=>{
if(e.target.checked)pbphLayer.addTo(map)
else map.removeLayer(pbphLayer)
}

document.getElementById('kebun-toggle').onchange=e=>{
if(e.target.checked)kebunLayer.addTo(map)
else map.removeLayer(kebunLayer)
}

document.getElementById('gambut-toggle').onchange=e=>{
if(e.target.checked)gambutLayer.addTo(map)
else map.removeLayer(gambutLayer)
}

const url="https://opensheet.elk.sh/1Vce5YUId7cUZ29j8OEhdFSer26cszXgX3OSm5zoX1UI/Data%20Hotspot%20Nasional"

let rawData=[]

function extractTanggal(t){
const p=t.split(',')[1]?.trim().split(' ')||[]
return p.slice(0,3).join(' ')
}

function applyFilters(){

hotspotLayer.clearLayers()

const levels=[...document.querySelectorAll('.confidence-filter:checked')].map(cb=>cb.value)

rawData.forEach(r=>{

const lat=parseFloat(r.Latitude)
const lon=parseFloat(r.Longitude)

if(isNaN(lat)||isNaN(lon))return

const conf=r.Confidence_Level?.toLowerCase()

if(!levels.includes(conf))return

const icon=L.divIcon({
html:conf==="high"?"🔴":"🟡",
className:"",
iconSize:[20,20]
})

L.marker([lat,lon],{icon:icon})
.addTo(hotspotLayer)
.bindPopup(`
<b>${r["Tanggal & Jam"]}</b><br>
${r.Provinsi} - ${r["Kab/Kota"]}<br>
Confidence : ${conf}<br>
<a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">
📍 Google Maps
</a>
`)

})

}

function fetchData(){

fetch(url)
.then(r=>r.json())
.then(data=>{
rawData=data
applyFilters()
})

}

function exportPBPH(){

const hasil=[]

rawData.forEach(r=>{

const lat=parseFloat(r.Latitude)
const lon=parseFloat(r.Longitude)

if(isNaN(lat)||isNaN(lon))return

const pt=turf.point([lon,lat])

let inside=false

if(pbphLayer){

pbphLayer.eachLayer(l=>{
const poly=l.toGeoJSON()

if(turf.booleanPointInPolygon(pt,poly))inside=true
})

}

if(inside){

hasil.push([
r["Tanggal & Jam"],
r.Provinsi,
r["Kab/Kota"],
r.Kecamatan,
r.Desa,
lat,
lon,
r.Confidence_Level
])

}

})

const {jsPDF}=window.jspdf

const doc=new jsPDF()

doc.text("Analisis Hotspot PBPH",14,10)

doc.autoTable({
head:[['Tanggal','Prov','Kab','Kec','Desa','Lat','Lng','Conf']],
body:hasil
})

doc.save("hotspot_pbph.pdf")

}

function exportKebun(){

const hasil=[]

rawData.forEach(r=>{

const lat=parseFloat(r.Latitude)
const lon=parseFloat(r.Longitude)

if(isNaN(lat)||isNaN(lon))return

const pt=turf.point([lon,lat])

let inside=false

if(kebunLayer){

kebunLayer.eachLayer(l=>{
const poly=l.toGeoJSON()

if(turf.booleanPointInPolygon(pt,poly))inside=true
})

}

if(inside){

hasil.push([
r["Tanggal & Jam"],
r.Provinsi,
r["Kab/Kota"],
r.Kecamatan,
r.Desa,
lat,
lon,
r.Confidence_Level
])

}

})

const {jsPDF}=window.jspdf

const doc=new jsPDF()

doc.text("Analisis Hotspot Kebun",14,10)

doc.autoTable({
head:[['Tanggal','Prov','Kab','Kec','Desa','Lat','Lng','Conf']],
body:hasil
})

doc.save("hotspot_kebun.pdf")

}

function checkPassword(){

const pass=document.getElementById('password-input').value

if(pass==="karla"){

localStorage.setItem("login","true")

document.getElementById('login-overlay').style.display="none"

fetchData()

}else{

document.getElementById('login-error').style.display="block"

}

}

window.onload=()=>{

if(localStorage.getItem("login")==="true"){

document.getElementById('login-overlay').style.display="none"

fetchData()

}

}

</script>

</body>
</html>
